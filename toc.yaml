navigation:
  - title: Security
    icon: shield
    page: pages/security.md
    visible_when:
      permissions:
        - canViewSecurity

  - title: Getting Started
    icon: rocket
    items:
      - title: Intro
        page: pages/getting-started/intro.md
      - title: Prerequisites
        page: pages/getting-started/prerequisites.md
      - title: Domain Setup
        page: pages/getting-started/domain.md
      - title: Slack App
        page: pages/getting-started/slack-app.md

  - title: Infrastructure
    icon: database
    items:
      - title: Database Setup
        page: pages/infrastructure/database.md
      - title: AWS
        terraform_module: github.com/slackernews/slackernews-terraform//aws?ref=main
      - title: Azure
        terraform_module: github.com/slackernews/slackernews-terraform//azure?ref=main
      - title: GCP
        terraform_module: github.com/slackernews/slackernews-terraform//gcp?ref=main

  - title: Installation
    icon: download
    items:
      - title: Overview
        page: pages/installation/overview.md
      - title: Requirements
        page: pages/installation/requirements.md
        visible_when:
          entitlements:
            - isEmbeddedClusterDownloadEnabled
      - title: Linux
        page: pages/installation/linux.md
        visible_when:
          entitlements:
            - isEmbeddedClusterDownloadEnabled
      - title: Helm
        page: pages/installation/helm.md
        visible_when:
          entitlements:
            - isHelmInstallEnabled
      - title: Preparing Values
        page: pages/installation/preparing-values.md
        visible_when:
          entitlements:
            - isHelmInstallEnabled
      - title: Demo Mode
        page: pages/installation/demo.md
      - title: Release History
        page: pages/installation/release-history.md

  - title: Post-Install
    icon: settings
    items:
      - title: Configuration
        page: pages/post-install/configuration.md
      - title: Integrations
        page: pages/post-install/integrations.md
      - title: Updates
        page: pages/post-install/updates.md
      - title: Telemetry
        page: pages/post-install/telemetry.md
      - title: CLI
        page: pages/post-install/cli.md

  - title: Support
    icon: life-buoy
    items:
      - title: Troubleshooting
        page: pages/support/troubleshooting.md
      - title: Support Bundles
        page: pages/support/bundles.md
      - title: FAQ
        page: pages/support/faq.md
      - title: Contact Support
        page: pages/support/contact.md

overrides:
  home: pages/home.md
